<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Treeops</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e1726;color:#e6f4ee;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
  main{max-width:34rem}
  h1{font-size:2rem;line-height:1.2;margin:0 0 12px}
  p{color:#a5b9b3;margin:0 0 20px}
  a{color:#4fd1a5}
</style>
<script>
  // The site used to have separate pages. Send old links to the matching section of the one-page site.
  (function () {
    var sections = {services: 'services', team: 'team', work: 'services', faq: 'process', contact: 'contact', index: '', tree: ''};
    var name = location.pathname.replace(/^\/+|\/+$/g, '').replace(/(\/index)?\.html$/, '');
    if (Object.prototype.hasOwnProperty.call(sections, name)) location.replace('/' + (sections[name] ? '#' + sections[name] : ''));
  })();
</script>
</head>
<body>
<main>
  <h1>This page could not be found.</h1>
  <p>The link may be out of date. Everything about Treeops is now on one page.</p>
  <a href="/">Go to treeops.net →</a>
</main>
</body>
</html>
