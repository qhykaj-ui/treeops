name: Deploy website
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check website
        run: node .github/scripts/check-site.mjs
      - name: Check external logos
        continue-on-error: true
        run: node .github/scripts/check-external.mjs
      - name: Collect public files
        # Publish only the website, never repository files such as README or workflows.
        run: |
          mkdir _site
          cp index.html 404.html CNAME robots.txt sitemap.xml .nojekyll _site/
          if [ -d assets ]; then cp -R assets _site/; fi
      - name: Package website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy tested website
        id: deployment
        uses: actions/deploy-pages@v4
